<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Urdu Voice</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0f172a; --card:#1e293b; --fg:#e2e8f0; --mut:#94a3b8; --acc:#22c55e; --err:#f87171; --bd:#334155; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:'Noto Nastaliq Urdu', 'Segoe UI', sans-serif; line-height:2; }
  body.en { font-family:'Segoe UI', Roboto, sans-serif; line-height:1.5; }
  .wrap { max-width:760px; margin:auto; padding:16px; }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .logo { font-family:Montserrat, sans-serif; font-weight:800; font-size:26px; direction:ltr; }
  .logo span { color:var(--acc); }
  .card { background:var(--card); border:1px solid var(--bd); border-radius:14px; padding:14px 16px; margin:12px 0; }
  h2 { margin:0 0 6px; font-size:18px; }
  label { display:block; color:var(--mut); font-size:14px; margin-top:8px; }
  input, select, textarea, button { font:inherit; color:var(--fg); }
  input, select, textarea { width:100%; background:#0b1220; border:1px solid var(--bd); border-radius:10px; padding:8px 10px; }
  textarea { min-height:220px; font-size:19px; line-height:2.3; resize:vertical; }
  input[type=password], .ltr { direction:ltr; text-align:left; font-family:monospace; }
  button { background:#334155; border:0; border-radius:10px; padding:8px 14px; margin:6px 0 0 6px; cursor:pointer; }
  button.pri { background:var(--acc); color:#052e14; font-weight:700; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .row { display:flex; gap:10px; flex-wrap:wrap; } .row > * { flex:1 1 160px; }
  .mut { color:var(--mut); font-size:13px; }
  .msg { margin-top:8px; font-size:15px; } .ok { color:var(--acc); } .bad { color:var(--err); }
  progress { width:100%; height:14px; }
  audio { width:100%; margin-top:8px; }
  a { color:#60a5fa; }
  details.adv { margin-top:10px; border-top:1px dashed var(--bd); padding-top:6px; }
  details.adv summary { cursor:pointer; color:var(--mut); font-size:14px; }
  .chk { display:flex; align-items:center; gap:6px; } .chk input { width:auto; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">Urdu <span>Voice</span></div>
    <button id="langBtn">English</button>
  </header>

  <!-- 1. API key -->
  <div class="card">
    <h2 data-t="keyTitle"></h2>
    <input id="key" type="password" autocomplete="off" placeholder="AIza...">
    <label class="chk"><input type="checkbox" id="remember"> <span data-t="remember"></span></label>
    <button id="testKey" data-t="testKey"></button>
    <button id="clearKey" data-t="clearKey"></button>
    <div class="mut"><a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener" data-t="getKey"></a> · <span data-t="keyNote"></span></div>
    <div id="keyMsg" class="msg"></div>
    <details class="adv"><summary data-t="advanced"></summary>
      <label data-t="model"></label>
      <div class="row">
        <select id="model" class="ltr"></select>
        <button id="loadModels" data-t="loadModels" style="flex:0 0 auto"></button>
      </div>
    </details>
  </div>

  <!-- 2. Script -->
  <div class="card">
    <h2 data-t="scriptTitle"></h2>
    <textarea id="script" dir="rtl"></textarea>
    <div class="mut" id="stats"></div>
    <button id="audition" data-t="audition"></button>
  </div>

  <!-- 3. Voice & style -->
  <div class="card">
    <h2 data-t="voiceTitle"></h2>
    <label data-t="voice"></label><select id="voice" class="ltr"></select>
    <details class="adv"><summary data-t="advanced"></summary>
      <div class="row">
        <div><label data-t="expr"></label><select id="expr"></select></div>
        <div><label data-t="pace"></label><select id="pace"></select></div>
      </div>
      <label data-t="accent"></label><select id="accent"></select>
      <label data-t="direction"></label>
      <input id="direction" data-tp="directionPh">
    </details>
  </div>

  <!-- 4. Generate -->
  <div class="card">
    <button id="go" class="pri" data-t="go"></button>
    <button id="cancel" data-t="cancel" disabled></button>
    <progress id="prog" value="0" max="1" hidden></progress>
    <div id="genMsg" class="msg"></div>
    <audio id="player" controls hidden></audio>
    <div id="outBtns" hidden>
      <button id="dlWav" data-t="dlWav"></button>
      <button id="dlMp3" data-t="dlMp3"></button>
      <button id="share" data-t="share"></button>
    </div>
    <div class="mut" data-t="shareNote"></div>
  </div>

  <!-- 5. Caption video (experimental) -->
  <div class="card" id="videoCard">
    <h2 data-t="videoTitle"></h2>
    <div class="mut" data-t="videoNote"></div>
    <label data-t="audioSrc"></label>
    <input id="audioFile" type="file" accept="audio/*,video/*">
    <div id="aMsg" class="msg"></div>
    <button id="autoPics" data-t="autoPics"></button>
    <button id="stopPics" data-t="cancel" disabled></button>
    <div id="pMsg" class="msg"></div>
    <div id="thumbs" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:8px"></div>
    <label data-t="bgImages"></label>
    <input id="bgFiles" type="file" accept="image/*" multiple>
    <label data-t="videoSize"></label>
    <select id="vSize">
      <option value="720x1280">9:16 (WhatsApp Status / Reels / Shorts)</option>
      <option value="1280x720">16:9 (YouTube)</option>
      <option value="1080x1080">1:1</option>
    </select>
    <details class="adv" id="styleBox"><summary data-t="advanced"></summary>
    <label data-t="autoTitle"></label>
    <div class="row">
      <select id="nPics"><option>4</option><option>6</option><option selected>8</option><option>10</option><option>12</option><option>16</option></select>
      <select id="picStyle"></select>
    </div>
    <label data-t="capLines"></label>
    <select id="capLines"><option value="1" selected>1</option><option value="2">2</option><option value="3">3</option></select>
      <div class="row">
        <div><label data-t="sText"></label><input type="color" id="sText" value="#ffffff"></div>
        <div><label data-t="sHlMode"></label><select id="sHlMode"></select></div>
      </div>
      <div class="row">
        <div><label data-t="sHlBg"></label><input type="color" id="sHlBg" value="#22c55e"></div>
        <div><label data-t="sHlText"></label><input type="color" id="sHlText" value="#052e14"></div>
      </div>
      <div class="row">
        <div><label data-t="sOutline"></label><input type="color" id="sOutline" value="#000000"></div>
        <div><label data-t="sOutlineW"></label><input type="range" id="sOutlineW" min="0" max="12" value="0"></div>
      </div>
      <div class="row">
        <div><label data-t="sSize"></label><input type="range" id="sSize" min="60" max="160" value="100"></div>
        <div><label data-t="sPos"></label><select id="sPos"></select></div>
      </div>
      <div class="row">
        <div><label data-t="sWave"></label><input type="color" id="sWave" value="#22c55e"></div>
        <div><label data-t="sWaveOn"></label><select id="sWaveOn"></select></div>
      </div>
      <div class="row">
        <div><label data-t="sBg1"></label><input type="color" id="sBg1" value="#0f172a"></div>
        <div><label data-t="sBg2"></label><input type="color" id="sBg2" value="#14532d"></div>
      </div>
      <label data-t="sDark"></label><input type="range" id="sDark" min="0" max="85" value="45">
      <label><span data-t="sOffset"></span> <b id="sOffsetV" class="ltr" style="font-family:inherit">0</b></label>
      <input type="range" id="sOffset" min="-1000" max="1000" step="50" value="-100">
      <button id="sReset" data-t="sReset"></button>
      <canvas id="sPreview" style="width:100%;max-width:260px;display:block;margin:10px auto 0;border-radius:10px;background:#000"></canvas>
    </details>
    <button id="makeVideo" class="pri" data-t="makeVideo" disabled></button>
    <div id="vNeedAudio" class="mut" data-t="vNeedAudio"></div>
    <button id="stopVideo" data-t="cancel" disabled></button>
    <progress id="vProg" value="0" max="1" hidden></progress>
    <div id="vMsg" class="msg"></div>
    <canvas id="vCanvas" style="width:100%;max-height:60vh;object-fit:contain;margin-top:8px;border-radius:10px;background:#000" hidden></canvas>
    <video id="vOut" controls playsinline style="width:100%;max-height:60vh;margin-top:8px" hidden></video>
    <button id="dlVideo" data-t="dlVideo" hidden></button>
    <button id="shareVideo" data-t="share" hidden></button>
  </div>

  <div class="mut" data-t="footer"></div>
</div>

  if (st.waveOn) {
    const i0 = Math.floor(now * SR), win = Math.floor(SR * 0.04), bw = W * 0.7 / bars, wy = st.pos === 0 ? H * 0.82 : H * 0.18;
    ctx.fillStyle = hexA(st.wave, 0.9);
    for (let b = 0; b < bars; b++) {
      let peak = 0; const o = i0 + (b - bars / 2) * win;
      for (let j = 0; j < win; j += 24) peak = Math.max(peak, Math.abs(pcm[o + j] || 0));
      const h = Math.max(4, (peak / 32768) * H * 0.12);
      ctx.fillRect(W * 0.15 + b * bw, wy - h / 2, bw * 0.6, h);
    }
  }
  const page = pages.find(p => now >= p.s - 0.05 && now < p.e + GAP) || pages.findLast(p => p.s <= now);
  if (page) {
    ctx.font = font; ctx.textAlign = "right"; ctx.textBaseline = "middle"; ctx.lineJoin = "round";
    const top = capY - (page.lines.length - 1) * lineH / 2, space = ctx.measureText(" ").width;
    page.lines.forEach((ln, li) => {
      const lw = ln.reduce((n, w) => n + w.width, 0) + space * (ln.length - 1);
      let x = W / 2 + lw / 2; const y = top + li * lineH;
      ln.forEach(wd => {
        const on = st.hl !== 3 && now >= wd.s && now < wd.e;
        if (on && st.hl === 0) { ctx.fillStyle = hexA(st.hlBg, 0.95); ctx.fillRect(x - wd.width - 8, y - lineH * 0.42, wd.width + 16, lineH * 0.84); }
        if (on && st.hl === 2) { ctx.fillStyle = st.hlBg; ctx.fillRect(x - wd.width, y + lineH * 0.36, wd.width, Math.max(4, fontPx * 0.09)); }
        if (st.outlineW && !(on && st.hl === 0)) { ctx.strokeStyle = st.outline; ctx.lineWidth = st.outlineW * fontPx / 40; ctx.strokeText(wd.w, x, y); }
        ctx.fillStyle = on ? (st.hl === 0 ? st.hlText : st.hlBg) : (now >= wd.e || st.hl === 3 ? st.text : hexA(st.text, 0.7));
        ctx.fillText(wd.w, x, y);
        x -= wd.width + space;
      });
    });
  }
  ctx.fillStyle = "rgba(255,255,255,0.25)"; ctx.fillRect(0, H - 8, W, 8);
  ctx.fillStyle = st.wave; ctx.fillRect(W - W * now / total, H - 8, W * now / total, 8);
}

let previewImg = null, uploadedImgs = [];
async function drawPreview() {
  const [W, H] = $("vSize").value.split("x").map(Number), cv = $("sPreview"), ctx = cv.getContext("2d");
  cv.width = W; cv.height = H;
  const st = getStyle(), nLines = parseInt($("capLines").value);
  const fontPx = Math.round(Math.min(W, H) * (nLines === 1 ? 0.075 : 0.058) * st.size / 100), font = `${fontPx}px "Noto Nastaliq Urdu"`;
  await document.fonts.load(font, "اردو"); ctx.font = font; ctx.direction = "rtl";
  const ws = t("sample").split(" "), words = ws.map((w, i) => ({ w, s: i, e: i + 1, part: 0 }));
  const pages = layoutPages(ctx, words, W * 0.86, nLines);
  const pcm = new Int16Array(SR * 6).map((_, i) => 12000 * Math.sin(i / 9) * Math.abs(Math.sin(i / 2500)));
  const pic = autoPics.find(p => p.im)?.im || previewImg;
  drawScene(ctx, W, H, 1.5, { pics: pic ? [{ im: pic, s: 0 }] : [], total: 5, pcm, pages, font, fontPx, st });
}

// ---- auto pictures (same Gemini key) ----
const STYLES = {
  ur: ["حقیقی تصویر (ڈاکیومنٹری)", "ڈیجیٹل پینٹنگ", "واٹر کلر", "کارٹون / بچوں کی کتاب", "سنیما جیسا ڈرامائی"],
  en: ["Photorealistic (documentary)", "Digital painting", "Watercolour", "Cartoon / children's book", "Cinematic dramatic"],
  p:  ["photorealistic documentary photograph, natural light", "detailed digital painting", "soft watercolour illustration",
       "colourful cartoon children's book illustration", "cinematic dramatic film still, epic lighting"],
};
let autoPics = [], picAbort = null;
function allModels() { return JSON.parse(localStorage.getItem("uv_all_models") || "[]"); }
function pickModel(re, fallback) { return allModels().filter(n => re.test(n)).sort().reverse()[0] || fallback; }
const textModel = () => pickModel(/^gemini-[\d.]+-flash$/, "gemini-2.5-flash");
const imageModel = () => pickModel(/^gemini-[\d.]+-flash-image(-preview)?$/, "gemini-2.5-flash-image");

// sentences of the current captions text, with the index of each sentence's first word
function sentencesWithWordIdx() {
  const texts = partTexts.length ? partTexts : splitText($("script").value);
  const out = []; let wi = 0;
  texts.forEach(tx => tx.split(/(?<=[۔.!؟?…])\s+/).filter(x => x.trim()).forEach(sn => {
    out.push({ text: sn, w: wi }); wi += sn.split(/\s+/).filter(Boolean).length;
  }));
  return out;
}
function sceneStart(fromSentence) {
  const sn = sentencesWithWordIdx()[fromSentence - 1], words = wordTimeline();
  return sn && words[sn.w] ? words[sn.w].s : 0;
}
async function gemini(model, body, signal) {
  for (let attempt = 0; ; attempt++) {
    const r = await fetch(`${API}/models/${model}:generateContent`, { method: "POST", signal,
      headers: { "Content-Type": "application/json", "x-goog-api-key": $("key").value.trim() }, body: JSON.stringify(body) });
    if (r.ok) return r.json();
    if ((r.status === 429 || r.status >= 500) && attempt < 3) { await sleep(5000 * 2 ** attempt, signal); continue; }
    const e = new Error(errText(r.status)); e.status = r.status; throw e;
  }
}
async function planScenes(n, signal) {
  const sents = sentencesWithWordIdx();
  const list = sents.map((x, i) => `${i + 1}. ${x.text}`).join("\n");
  const prompt = `You are a storyboard artist for a narrated Urdu video. Below is the narration split into ${sents.length} numbered sentences.
Divide it, in order, into exactly ${Math.min(n, sents.length)} scenes that follow the story. For each scene give "from" = the number of the first sentence it covers (the first scene starts at 1, numbers strictly increasing) and "prompt" = a detailed English description of ONE picture that shows what is being said at that point (setting, subject, mood). No text, letters or captions inside the picture. For religious text show nature/landscape only, never people or holy figures.
Return JSON only: [{"from": 1, "prompt": "..."}]

${list}`;
  const j = await gemini(textModel(), { contents: [{ parts: [{ text: prompt }] }], generationConfig: { responseMimeType: "application/json" } }, signal);
  const txt = j.candidates?.[0]?.content?.parts?.map(p => p.text || "").join("") || "[]";
  let sc = JSON.parse(txt.replace(/^```(json)?|```$/g, "").trim());
  sc = sc.filter(x => x && x.prompt).map(x => ({ from: Math.max(1, Math.min(sents.length, parseInt(x.from) || 1)), prompt: String(x.prompt) }));
  sc.sort((a, b) => a.from - b.from); if (sc.length) sc[0].from = 1;
  return sc;
}
async function drawPicture(prompt, signal) {
  const [W, H] = $("vSize").value.split("x").map(Number), ar = W > H ? "16:9" : W < H ? "9:16" : "1:1";
  const style = STYLES.p[$("picStyle").value];
  const body = { contents: [{ parts: [{ text: `${prompt}. Style: ${style}. Aspect ratio ${ar}. No text, no letters, no watermark.` }] }],
                 generationConfig: { responseModalities: ["IMAGE"], imageConfig: { aspectRatio: ar } } };
  let j;
  try { j = await gemini(imageModel(), body, signal); }
  catch (e) { if (e.status !== 400) throw e; delete body.generationConfig.imageConfig; body.generationConfig.responseModalities = ["TEXT", "IMAGE"]; j = await gemini(imageModel(), body, signal); }
  const part = j.candidates?.[0]?.content?.parts?.find(p => p.inlineData?.data);
  if (!part) throw new Error(t("picFail"));
  return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = `data:${part.inlineData.mimeType || "image/png"};base64,${part.inlineData.data}`; });
}
function renderThumbs() {
  $("thumbs").innerHTML = "";
  autoPics.forEach((p, i) => {
    const d = document.createElement("div"); d.style.cssText = "background:#0b1220;border-radius:8px;overflow:hidden;text-align:center;font-size:12px";
    d.title = p.prompt;
    d.innerHTML = p.im ? "" : `<div style="height:96px;display:flex;align-items:center;justify-content:center">${p.err ? "⚠" : "…"}</div>`;
    if (p.im) { const im = p.im.cloneNode(); im.style.cssText = "width:100%;height:96px;object-fit:cover;display:block"; d.appendChild(im); }
    const b = document.createElement("button"); b.textContent = `${i + 1} · ${t("redo")}`; b.style.cssText = "margin:4px;padding:2px 8px;font-size:12px";
    b.onclick = async () => {
      b.disabled = true; p.im = null; p.err = false; renderThumbs();
      try { p.im = await drawPicture(p.prompt); } catch (e) { p.err = true; msg("pMsg", `${t("picDraw")} ${i + 1}: ${e.message}`, "bad"); }
      renderThumbs();
    };
    d.appendChild(b); $("thumbs").appendChild(d);
  });
}
$("autoPics").onclick = async () => {
  if (!$("key").value.trim()) return msg("pMsg", t("needKey"), "bad");
  if (!sentencesWithWordIdx().length) return msg("pMsg", t("picNeedText"), "bad");
  if (!localStorage.getItem("uv_all_models")) await refreshModels(true);
  picAbort = new AbortController(); $("autoPics").disabled = true; $("stopPics").disabled = false;
  try {
    msg("pMsg", t("picPlan"));
    const scenes = await planScenes(parseInt($("nPics").value), picAbort.signal);
    autoPics = scenes.map(x => ({ ...x, im: null, err: false })); renderThumbs();
    for (let i = 0; i < autoPics.length; i++) {
      msg("pMsg", `${t("picDraw")} ${i + 1} ${t("of")} ${autoPics.length}…`);
      try { autoPics[i].im = await drawPicture(autoPics[i].prompt, picAbort.signal); }
      catch (e) { if (e.name === "AbortError") throw e; autoPics[i].err = true; }
      renderThumbs();
    }
    const bad = autoPics.filter(p => !p.im).length;
    msg("pMsg", t("picDone") + (bad ? ` (${bad} ⚠ ${t("picFail")})` : "") + " " + t("picCost") + " " + (uploadedImgs.length ? t("upReplaces") : ""), bad ? "bad" : "ok");
  } catch (e) { msg("pMsg", e.name === "AbortError" ? t("cancelled") : e.message, "bad"); }
  finally { $("autoPics").disabled = false; $("stopPics").disabled = true; }
};
$("stopPics").onclick = () => picAbort?.abort();

// ---- init ----
$("voice").innerHTML = VOICES.map(v => `<option>${v}</option>`).join("");
fillModels(JSON.parse(localStorage.getItem("uv_models") || "null") || DEFAULT_MODELS);
const saved = localStorage.getItem("uv_key"); if (saved) { $("key").value = saved; $("remember").checked = true; }
lang = localStorage.getItem("uv_lang") || "ur";
loadStyle();
applyLang();
STYLE_IDS.forEach(id => $(id).addEventListener("input", saveStyle));
$("sReset").onclick = () => { STYLE_IDS.forEach(id => $(id).value = STYLE_DEF[id]); saveStyle(); };
$("vSize").addEventListener("change", drawPreview); $("capLines").addEventListener("change", drawPreview);
$("styleBox").addEventListener("toggle", drawPreview);
$("bgFiles").addEventListener("change", async () => {
  // read every picture NOW (phones may block reading the file again later) and keep a resized copy (max 1920 px)
  const files = [...$("bgFiles").files]; uploadedImgs = [];
  msg("vMsg", "…");
  for (const im of await loadImages(files)) {
    const r = Math.min(1, 1920 / Math.max(im.width, im.height)), c = document.createElement("canvas");
    c.width = Math.round(im.width * r); c.height = Math.round(im.height * r); c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
    URL.revokeObjectURL(im.src); uploadedImgs.push(c);
  }
  previewImg = uploadedImgs[0] || null; drawPreview();
  msg("vMsg", files.length ? `🖼️ ${uploadedImgs.length}/${files.length} ✓` + (uploadedImgs.length < files.length ? " — " + t("imgBad") : "") : "", uploadedImgs.length < files.length ? "bad" : "ok");
});
</script>
