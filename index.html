<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Urdu Voice</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0f172a; --card:#1e293b; --fg:#e2e8f0; --mut:#94a3b8; --acc:#22c55e; --err:#f87171; --bd:#334155; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:'Noto Nastaliq Urdu', 'Segoe UI', sans-serif; line-height:2; }
  body.en { font-family:'Segoe UI', Roboto, sans-serif; line-height:1.5; }
  .wrap { max-width:760px; margin:auto; padding:16px; }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .logo { font-family:Montserrat, sans-serif; font-weight:800; font-size:26px; direction:ltr; }
  .logo span { color:var(--acc); }
  .card { background:var(--card); border:1px solid var(--bd); border-radius:14px; padding:14px 16px; margin:12px 0; }
  h2 { margin:0 0 6px; font-size:18px; }
  label { display:block; color:var(--mut); font-size:14px; margin-top:8px; }
  input, select, textarea, button { font:inherit; color:var(--fg); }
  input, select, textarea { width:100%; background:#0b1220; border:1px solid var(--bd); border-radius:10px; padding:8px 10px; }
  textarea { min-height:220px; font-size:19px; line-height:2.3; resize:vertical; }
  input[type=password], .ltr { direction:ltr; text-align:left; font-family:monospace; }
  button { background:#334155; border:0; border-radius:10px; padding:8px 14px; margin:6px 0 0 6px; cursor:pointer; }
  button.pri { background:var(--acc); color:#052e14; font-weight:700; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .row { display:flex; gap:10px; flex-wrap:wrap; } .row > * { flex:1 1 160px; }
  .mut { color:var(--mut); font-size:13px; }
  .msg { margin-top:8px; font-size:15px; } .ok { color:var(--acc); } .bad { color:var(--err); }
  progress { width:100%; height:14px; }
  audio { width:100%; margin-top:8px; }
  a { color:#60a5fa; }
  .chk { display:flex; align-items:center; gap:6px; } .chk input { width:auto; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">Urdu <span>Voice</span></div>
    <button id="langBtn">English</button>
  </header>

  <!-- 1. API key -->
  <div class="card">
    <h2 data-t="keyTitle"></h2>
    <input id="key" type="password" autocomplete="off" placeholder="AIza...">
    <label class="chk"><input type="checkbox" id="remember"> <span data-t="remember"></span></label>
    <button id="testKey" data-t="testKey"></button>
    <button id="clearKey" data-t="clearKey"></button>
    <div class="mut"><a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener" data-t="getKey"></a> · <span data-t="keyNote"></span></div>
    <label data-t="model"></label>
    <div class="row">
      <select id="model" class="ltr"></select>
      <button id="loadModels" data-t="loadModels" style="flex:0 0 auto"></button>
    </div>
    <div id="keyMsg" class="msg"></div>
  </div>

  <!-- 2. Script -->
  <div class="card">
    <h2 data-t="scriptTitle"></h2>
    <textarea id="script" dir="rtl"></textarea>
    <div class="mut" id="stats"></div>
    <button id="audition" data-t="audition"></button>
  </div>

  <!-- 3. Voice & style -->
  <div class="card">
    <h2 data-t="voiceTitle"></h2>
    <div class="row">
      <div><label data-t="voice"></label><select id="voice" class="ltr"></select></div>
      <div><label data-t="expr"></label><select id="expr"></select></div>
    </div>
    <div class="row">
      <div><label data-t="pace"></label><select id="pace"></select></div>
      <div><label data-t="accent"></label><select id="accent"></select></div>
    </div>
    <label data-t="direction"></label>
    <input id="direction" data-tp="directionPh">
  </div>

  <!-- 4. Generate -->
  <div class="card">
    <button id="go" class="pri" data-t="go"></button>
    <button id="cancel" data-t="cancel" disabled></button>
    <progress id="prog" value="0" max="1" hidden></progress>
    <div id="genMsg" class="msg"></div>
    <audio id="player" controls hidden></audio>
    <div id="outBtns" hidden>
      <button id="dlWav" data-t="dlWav"></button>
      <button id="dlMp3" data-t="dlMp3"></button>
      <button id="share" data-t="share"></button>
    </div>
    <div class="mut" data-t="shareNote"></div>
  </div>

  <!-- 5. Caption video (experimental) -->
  <div class="card" id="videoCard">
    <h2 data-t="videoTitle"></h2>
    <div class="mut" data-t="videoNote"></div>
    <label data-t="audioSrc"></label>
    <input id="audioFile" type="file" accept="audio/*,video/*">
    <div id="aMsg" class="msg"></div>
    <label data-t="autoTitle"></label>
    <div class="row">
      <select id="nPics"><option>4</option><option>6</option><option selected>8</option><option>10</option><option>12</option><option>16</option></select>
      <select id="picStyle"></select>
    </div>
    <button id="autoPics" data-t="autoPics"></button>
    <button id="stopPics" data-t="cancel" disabled></button>
    <div id="pMsg" class="msg"></div>
    <div id="thumbs" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:8px"></div>
    <label data-t="bgImages"></label>
    <input id="bgFiles" type="file" accept="image/*" multiple>
    <label data-t="capLines"></label>
    <select id="capLines"><option value="1" selected>1</option><option value="2">2</option><option value="3">3</option></select>
    <label data-t="videoSize"></label>
    <select id="vSize">
      <option value="720x1280">9:16 (WhatsApp Status / Reels / Shorts)</option>
      <option value="1280x720">16:9 (YouTube)</option>
      <option value="1080x1080">1:1</option>
    </select>
    <button id="makeVideo" class="pri" data-t="makeVideo" disabled></button>
    <div id="vNeedAudio" class="mut" data-t="vNeedAudio"></div>
    <button id="stopVideo" data-t="cancel" disabled></button>
    <progress id="vProg" value="0" max="1" hidden></progress>
    <div id="vMsg" class="msg"></div>
    <canvas id="vCanvas" style="width:100%;max-height:60vh;object-fit:contain;margin-top:8px;border-radius:10px;background:#000" hidden></canvas>
    <video id="vOut" controls playsinline style="width:100%;max-height:60vh;margin-top:8px" hidden></video>
    <button id="dlVideo" data-t="dlVideo" hidden></button>
    <button id="shareVideo" data-t="share" hidden></button>
  </div>

  <div class="mut" data-t="footer"></div>
</div>

<script>
const T = {

    scriptTitle:"۲۔ اسکرپٹ", audition:"آزمائشی جملہ ڈالیں", voiceTitle:"۳۔ آواز اور انداز", voice:"آواز", expr:"تاثر", pace:"رفتار", accent:"لہجہ",

    part:"حصہ", of:"از", retry:"دوبارہ کوشش", done:"✓ مکمل", duration:"دورانیہ", size:"سائز", cancelled:"روک دیا گیا۔", mp3Wait:"MP3 بن رہا ہے…",
    e400:"درخواست غلط ہے (400) — ماڈل کا نام یا متن چیک کریں۔", e401:"کی غلط ہے یا اجازت نہیں (401/403)۔", e404:"یہ ماڈل موجود نہیں (404) — 'ماڈل لوڈ کریں' دبائیں۔",
    e429:"حد ختم (429) — کچھ دیر بعد کوشش کریں یا Google AI Studio میں حد دیکھیں۔", eNet:"انٹرنیٹ یا سرور کا مسئلہ۔", eNoAudio:"جواب میں آڈیو نہیں آیا۔",
    videoTitle:"۵۔ کیپشن ویڈیو (تجرباتی)", videoNote:"آپ کی آواز + الفاظ کی ہائی لائٹ والے اردو کیپشن + ویو فارم۔ ویڈیو اصل وقت میں بنتی ہے (۵ منٹ آڈیو = ۵ منٹ)، اس دوران یہ ٹیب کھلا رکھیں۔ الفاظ کا وقت اندازاً ہے۔",

    autoTitle:"🖼️ خودکار تصاویر — اسی Gemini کی سے، اسکرپٹ کے مناظر کے مطابق (تعداد اور انداز)", autoPics:"🖼️ تصاویر بنائیں", redo:"دوبارہ", picPlan:"مناظر تیار ہو رہے ہیں…", picDraw:"تصویر", picDone:"✓ تصاویر تیار — ہر تصویر اپنے حصے پر دکھائی جائے گی۔ کسی تصویر کو بدلنے کے لیے 'دوبارہ' دبائیں۔", picNeedText:"پہلے اسکرپٹ باکس میں متن لکھیں۔", picFail:"تصویر نہیں بنی", picCost:"نوٹ: تصاویر Google کی حد/بل میں شمار ہوتی ہیں۔", upReplaces:"(اپ لوڈ کی گئی تصاویر خودکار تصاویر کی جگہ لے لیں گی)",

  },
  en: {
    keyTitle:"1. Your Gemini API key", remember:"Remember on this device", testKey:"Test key", clearKey:"Clear key",
    getKey:"Create a key in Google AI Studio", keyNote:"The key is sent only to Google.", model:"Model", loadModels:"Load models",
    scriptTitle:"2. Script", audition:"Insert audition sentence", voiceTitle:"3. Voice & style", voice:"Voice", expr:"Expression", pace:"Pace", accent:"Accent",
    direction:"Extra direction (optional)", directionPh:"e.g. storyteller style, stress the key lines",
    go:"▶ Generate", cancel:"Cancel", dlWav:"Download WAV", dlMp3:"Download MP3", share:"Share (WhatsApp)",
    shareNote:"Share the audio file, not an app link. iPhone: Share → Save to Files. Android: it goes to Downloads.",
    footer:"Note: Urdu is not in Google's TTS language list, so pronunciation is not guaranteed — listen to a short test first. Free quota is per Google project, not unlimited.",
    chars:"chars", parts:"parts", est:"est. length", min:"min", sec:"s",
    needKey:"Enter an API key first.", needText:"Write a script first.", keyOk:"✓ Key works.", testing:"Testing…",
    modelsLoaded:"TTS models loaded:", noTtsModels:"No TTS models found for this key.", cleared:"Key removed from this device (still active at Google — delete it there to revoke).",
    part:"Part", of:"of", retry:"retrying", done:"✓ Done", duration:"Length", size:"Size", cancelled:"Cancelled.", mp3Wait:"Encoding MP3…",
    e400:"Bad request (400) — check the model name or text.", e401:"Invalid key or no permission (401/403).", e404:"Model not found (404) — press 'Load models'.",
    e429:"Quota exceeded (429) — wait and retry, or check limits in Google AI Studio.", eNet:"Network or server problem.", eNoAudio:"No audio in the response.",
    videoTitle:"5. Caption video (experimental)", videoNote:"Your audio + Urdu captions with word highlighting + waveform. Recorded in real time (5 min audio = 5 min), keep this tab open and visible. Word timing is approximate.",
    bgImages:"Or upload your own pictures (shown in order, equal time each)", videoSize:"Size", makeVideo:"🎬 Make video", dlVideo:"Download video",
    autoTitle:"🖼️ Auto pictures — same Gemini key, one per scene of the script (count and style)", autoPics:"🖼️ Make pictures", redo:"Redo", picPlan:"Planning scenes…", picDraw:"Picture", picDone:"✓ Pictures ready — each is shown during its part of the script. Press Redo on any picture to replace it.", picNeedText:"Write the script in the Script box first.", picFail:"picture failed", picCost:"Note: pictures count toward your Google quota/bill.", upReplaces:"(uploaded pictures replace the auto pictures)",
    capLines:"Captions — lines shown at a time", vNeedAudio:"👆 First press ▶ Generate above, or upload your own audio file below.", audioSrc:"Or upload your own audio (MP3/WAV/M4A/WhatsApp voice) — put its text in the Script box above for captions", aLoaded:"✓ Audio loaded", aBad:"Could not open this audio file.", aNoText:"Write the audio's text in the Script box above for captions.", vMaking:"Making video… keep this tab open", vDone:"✓ Video ready", vNoSupport:"This browser can't record video — use Chrome.", vWebm:"Note: file is WebM; if WhatsApp rejects it, a recent Chrome (Android/PC) produces MP4.",
  }
};
const OPTS = {
  expr: { ur:["عام","گرمجوش","پُرجوش","سنجیدہ","کہانی گو","خبریں"], en:["Neutral","Warm","Excited","Serious","Storyteller","Newsreader"],
          p:["", "in a warm, friendly tone", "with excitement and energy", "in a serious, calm tone", "like an engaging storyteller", "like a professional news anchor"] },
  pace: { ur:["عام","آہستہ","تیز"], en:["Normal","Slow","Fast"], p:["", "slowly and clearly", "at a brisk pace"] },
  accent:{ ur:["پاکستانی اردو","لکھنوی / ادبی","عام"], en:["Pakistani Urdu","Lucknowi / literary","Default"],
          p:["with a natural Pakistani Urdu accent", "with a refined literary Urdu (Lucknowi) accent", ""] },
};
const VOICES = ["Kore","Zephyr","Puck","Charon","Fenrir","Leda","Orus","Aoede","Callirrhoe","Autonoe","Enceladus","Iapetus","Umbriel","Algieba",
  "Despina","Erinome","Algenib","Rasalgethi","Laomedeia","Achernar","Alnilam","Schedar","Gacrux","Pulcherrima","Achird","Zubenelgenubi",
  "Vindemiatrix","Sadachbia","Sadaltager","Sulafat"];
const DEFAULT_MODELS = ["gemini-2.5-flash-preview-tts","gemini-2.5-pro-preview-tts"];
const AUDITION = "السلام علیکم! آج ہم اردو میں اپنا پہلا وائس اوور بنا رہے ہیں۔";
const API = "https://generativelanguage.googleapis.com/v1beta";
const SR = 24000, CHUNK = 900;

const $ = id => document.getElementById(id);
let lang = "ur", pcmParts = [], partTexts = [], wavBlob = null, abortCtl = null;
const t = k => T[lang][k];

function applyLang() {
  document.documentElement.lang = lang; document.documentElement.dir = lang === "ur" ? "rtl" : "ltr";
  document.body.classList.toggle("en", lang === "en");
  document.querySelectorAll("[data-t]").forEach(e => e.textContent = t(e.dataset.t));
  document.querySelectorAll("[data-tp]").forEach(e => e.placeholder = t(e.dataset.tp));
  $("langBtn").textContent = lang === "ur" ? "English" : "اردو";
  { const ps = $("picStyle"), v = ps.selectedIndex; ps.innerHTML = STYLES[lang].map((x,i) => `<option value="${i}">${x}</option>`).join(""); ps.selectedIndex = Math.max(0, v); }
  for (const k of ["expr","pace","accent"]) {
    const s = $(k), v = s.selectedIndex;
    s.innerHTML = OPTS[k][lang].map((x,i) => `<option value="${i}">${x}</option>`).join("");
    s.selectedIndex = Math.max(0, v);
  }
  updateStats();
}
function fillModels(list) {
  const cur = $("model").value || localStorage.getItem("uv_model");
  $("model").innerHTML = list.map(m => `<option>${m}</option>`).join("");
  if (cur && list.includes(cur)) $("model").value = cur;
}
function msg(el, text, cls) { $(el).textContent = text; $(el).className = "msg " + (cls || ""); }

// ---- chunking at sentence boundaries ----
function splitText(text) {
  const sents = text.replace(/\r/g, "").split(/(?<=[۔.!؟?…])\s+|\n+/).map(s => s.trim()).filter(s => s && !/^[.\s۔]+$/.test(s));
  const out = []; let cur = "";
  for (const s of sents) {
    if (cur && cur.length + s.length + 1 > CHUNK) { out.push(cur); cur = s; } else cur = cur ? cur + " " + s : s;
  }
  if (cur) out.push(cur);
  return out;
}
function updateStats() {
  const txt = $("script").value, n = txt.trim().length;
  const secs = Math.round(n / 13);   // rough: ~13 Urdu chars per second
  $("stats").textContent = `${n} ${t("chars")} · ${splitText(txt).length} ${t("parts")} · ${t("est")} ~${secs >= 60 ? (secs/60).toFixed(1)+" "+t("min") : secs+" "+t("sec")}`;
}

// ---- API ----
function errText(status) {
  if (status === 400) return t("e400"); if (status === 401 || status === 403) return t("e401");
  if (status === 404) return t("e404"); if (status === 429) return t("e429"); return t("eNet") + (status ? ` (${status})` : "");
}
function styleLine() {
  const bits = [OPTS.accent.p[$("accent").value], OPTS.expr.p[$("expr").value], OPTS.pace.p[$("pace").value], $("direction").value.trim()].filter(Boolean);
  return "Read the following Urdu text aloud" + (bits.length ? " " + bits.join(", ") : "") + ". Do not read these instructions:\n\n";
}
async function tts(text, signal) {
  const body = {
    contents: [{ parts: [{ text: styleLine() + text }] }],
    generationConfig: { responseModalities: ["AUDIO"], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: $("voice").value } } } }
  };
  for (let attempt = 0; ; attempt++) {
    let r;
    try {
      r = await fetch(`${API}/models/${$("model").value}:generateContent`, {
        method: "POST", signal, headers: { "Content-Type": "application/json", "x-goog-api-key": $("key").value.trim() }, body: JSON.stringify(body) });
    } catch (e) { if (e.name === "AbortError") throw e; if (attempt < 3) { await sleep(2000 * 2 ** attempt, signal); continue; } throw new Error(t("eNet")); }
    if (r.ok) {
      const j = await r.json();
      const part = j.candidates?.[0]?.content?.parts?.find(p => p.inlineData?.data);
      if (!part) throw new Error(t("eNoAudio"));
      const bin = atob(part.inlineData.data), u8 = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      return new Int16Array(u8.buffer, 0, u8.length >> 1);
    }
    if ((r.status === 429 || r.status >= 500) && attempt < 3) { await sleep(5000 * 2 ** attempt, signal); continue; }
    throw new Error(errText(r.status));
  }
}
const sleep = (ms, signal) => new Promise((res, rej) => {
  const id = setTimeout(res, ms); signal?.addEventListener("abort", () => { clearTimeout(id); rej(new DOMException("", "AbortError")); });
});

// ---- audio building ----
function joinPcm(parts) {
  const gap = new Int16Array(Math.round(SR * 0.3));
  const total = parts.reduce((n, p) => n + p.length + gap.length, 0), out = new Int16Array(total);
  let o = 0; for (const p of parts) { out.set(p, o); o += p.length + gap.length; }
  return out;
}
function wav(pcm) {

    }
    const bad = autoPics.filter(p => !p.im).length;
    msg("pMsg", t("picDone") + (bad ? ` (${bad} ⚠ ${t("picFail")})` : "") + " " + t("picCost") + " " + ($("bgFiles").files.length ? t("upReplaces") : ""), bad ? "bad" : "ok");
  } catch (e) { msg("pMsg", e.name === "AbortError" ? t("cancelled") : e.message, "bad"); }
  finally { $("autoPics").disabled = false; $("stopPics").disabled = true; }
};
$("stopPics").onclick = () => picAbort?.abort();

// ---- init ----
$("voice").innerHTML = VOICES.map(v => `<option>${v}</option>`).join("");
fillModels(JSON.parse(localStorage.getItem("uv_models") || "null") || DEFAULT_MODELS);
const saved = localStorage.getItem("uv_key"); if (saved) { $("key").value = saved; $("remember").checked = true; }
lang = localStorage.getItem("uv_lang") || "ur";
applyLang();
</script>
</body>
